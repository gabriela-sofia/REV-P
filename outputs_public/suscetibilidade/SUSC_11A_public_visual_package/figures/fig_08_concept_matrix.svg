<svg viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg"><rect width="520" height="320" fill="#ffffff"/><text x="260" y="20" text-anchor="middle" font-size="14" fill="#222">Suscetibilidade ≠ evento ≠ ground truth</text><rect x="40" y="60" width="130" height="60" rx="6" fill="#e6f4ea" stroke="#2da44e"/><text x="105" y="95" text-anchor="middle" font-size="11" fill="#14532d">Suscetibilidade<tspan x="105" dy="14">(predisposição)</tspan></text><rect x="195" y="60" width="130" height="60" rx="6" fill="#fff4e5" stroke="#e8730a"/><text x="260" y="95" text-anchor="middle" font-size="11" fill="#7c2d12">Evento observado<tspan x="260" dy="14">(documental)</tspan></text><rect x="350" y="60" width="130" height="60" rx="6" fill="#fde8e8" stroke="#cf222e"/><text x="415" y="95" text-anchor="middle" font-size="11" fill="#7f1d1d">Ground truth<tspan x="415" dy="14">(NÃO existe)</tspan></text><text x="260" y="160" text-anchor="middle" font-size="13" fill="#222">≠ &#160;&#160;&#160; ≠</text><text x="260" y="200" text-anchor="middle" font-size="11" fill="#555">aderência espacial review-only não fecha a cadeia</text><text x="260" y="314" text-anchor="middle" font-size="10" fill="#999">review-only — NÃO ground truth</text></svg>